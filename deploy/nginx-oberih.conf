# Приклад конфігурації Nginx для сайту КЗ «НРЦ «Оберіг»»
# Скопіюйте у /etc/nginx/sites-available/oberih.conf, замініть ДОМЕН та шляхи на справжні,
# створіть символьне посилання у /etc/nginx/sites-enabled/ та перевірте: sudo nginx -t

# 1. Перенаправлення з HTTP (80) на HTTPS (443)
server {
    listen 80;
    listen [::]:80;
    server_name example.if.ua www.example.if.ua;

    # Для автоматичного поновлення сертифікатів Let's Encrypt (Certbot)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://example.if.ua$request_uri;
    }
}

# 2. Перенаправлення з www на основний домен без www (за потреби)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.example.if.ua;

    ssl_certificate /etc/letsencrypt/live/example.if.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.if.ua/privkey.pem;

    return 301 https://example.if.ua$request_uri;
}

# 3. Основний HTTPS-сервер
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.if.ua;

    # Сертифікати Let's Encrypt
    ssl_certificate /etc/letsencrypt/live/example.if.ua/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.if.ua/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Максимальний розмір завантажуваного файлу (дозволяє завантажувати PDF до 20 МБ в адмінці)
    client_max_body_size 25M;

    # Статичні файли (зібрані командою python manage.py collectstatic)
    location /static/ {
        alias /var/www/oberih-site/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }

    # Завантажені редакторами медіафайли (PDF-документи, фотографії)
    # Заборонено виконання скриптів і увімкнено nosniff + sandbox
    location /media/ {
        alias /var/www/oberih-site/media/;
        expires 7d;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;

        # Заборона виконання будь-яких скриптів із каталогу media
        location ~* \.(php|py|pl|sh|cgi|fcgi|html|htm|svg|js)$ {
            deny all;
        }
    }

    # Проксування всіх динамічних запитів на Gunicorn
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # ВАЖЛИВО: передає схему https у Django (у .env має бути USE_X_FORWARDED_PROTO=True)
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 30s;
        proxy_connect_timeout 10s;
    }
}

